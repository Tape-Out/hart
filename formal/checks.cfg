# hart 的 riscv-formal 检查清单。格式照 cores/nerv/checks.cfg。
# 这一版只验 RV32I、M 态：mkHart 以 mul、smode、mmu 都关、rvfi 开编出 mkRvOn.v。
# 深度：nerv 取 10；hart 一条指令要取指、执行（访存再多一拍），响应还可以晚到，一般项按 20。
# reg 按 15：formalexp.sh 实测，深度 12 约 75 秒、15 约 460 秒（boolector），20 跑十分钟没出结论。

[options]
isa rv32i

[depth]
insn            20
reg        10   15
pc_fwd     10   20
pc_bwd     10   20
unique     1 10 20
causal     10   20
ill             20
# liveness：第 10 拍出记录的那一条，到第 30 拍必须看到下一条；hang：到第 30 拍至少出过一条。
# 这两项 genchecks 会定义 RISCV_FORMAL_FAIRNESS，外壳据此要求一笔请求最多等两拍
liveness   1 10 30
hang       1    30

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
// bsc 生成的 initial 块给每个寄存器一个固定初值，求解器就只从那一个初态出发；
// 关掉它，没有复位的寄存器才是任意初值
`define BSV_NO_INITIAL_BLOCKS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/mkRvOn.v
