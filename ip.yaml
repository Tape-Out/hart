name: hart
version: 0.1.0
spec: '0.1'
kind: ip
lang:
- bsv
- bh
identity:
  slug: hart-tapeout-bsv
  display_name: RV32I machine mode core
  summary: Three stages, stall rather than bypass, four cycle multiply.
  category: core
  subcategories:
  - riscv
  ip_family: hart
  integration_profile: []
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: none
    aw: 12
    dw: 32
params: {}
features:
  mul:
    type: bool
    default: true
    desc: M 扩展。乘法四周期、除法逐位，见 E28
    area:
      fixed: 7690.480000000003
  smode:
    type: bool
    default: false
    desc: 监管者态。委托、S 的陷入现场与 sret；E27 证过特权级范围是一个开关而不是架构分岔
    area:
      fixed: 4070.3600000000006
  mmu:
    type: bool
    default: false
    desc: Sv32 地址翻译。16 条全相联 TLB（E29 定案）加两级页表遍历器；没有监管者态就没有它
    depends: [smode]
    area:
      fixed: 27004.04
test:
  # 访存口在收到响应之前一直顶着 valid 与 req 不动，「响应即已被接收」，所以不看 ready
  deadread:
  - dRdy
  # MMU 下游同理，而且它必须不看：ready 一旦牵着下游，「上游的请求 -> 下游的
  # valid -> 下游的 ready -> 上游的 ready」就绕成一个环，bsc 会把接线那条规则
  # 整条丢掉（G0009）。契约原文写明一次一笔的发起方可以不看 ready。
  - dnRdy
  unused:
  - mie_stie
  - mie_seie
  - mip_stip_in
  - mip_seip_in
  - mscratch
  - sscratch
emit:
- kind: bsv
  package: Hart
  module: mkHart
  config_type: HartCfg
  interface: HartIfc
  pins:
  - name: imem
    type: RegManager
    targs:
    - 32
    - 32
  - name: dmem
    type: RegManager
    targs:
    - 32
    - 32
  - name: irq
    type: HartIrq
  - name: pins
    type: HartPins
deps:
  hwcore: ^0.1
area:
  base:
    fixed: 36965.6
  margin: 0.0
  model: measured-grid
  error:
    bound: 0.0
    sign: exact
    note: three boolean knobs with mmu depending on smode leave six valid 
      combinations, and all six are measured, so every configuration is a table 
      lookup and nothing is ever extrapolated
  measured:
  - at:
      mul: false
      smode: false
      mmu: false
    um2: 36965.6
  - at:
      mul: false
      smode: true
      mmu: false
    um2: 40821.48
  - at:
      mul: false
      smode: true
      mmu: true
    um2: 67825.52
  - at:
      mul: true
      smode: false
      mmu: false
    um2: 44602.32
  - at:
      mul: true
      smode: true
      mmu: false
    um2: 48719.44
  - at:
      mul: true
      smode: true
      mmu: true
    um2: 73027.64
  corner:
    tool: ecc
    pdk: ics55
    freq_mhz: 100
    measured: '2026-09-14'
