name: hart
version: 0.1.0
spec: '0.1'
kind: ip
lang: [bsv, bh]
identity:
  slug: hart-tapeout-bsv
  display_name: RV32I machine mode core
  summary: Three stages, stall rather than bypass, four cycle multiply.
  category: core
  subcategories:
  - riscv
  ip_family: hart
  integration_profile: []
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: none
    aw: 12
    dw: 32
params: {}
features:
  mul:
    type: bool
    default: true
    desc: M 扩展。乘法四周期、除法逐位，见 E28
  smode:
    type: bool
    default: false
    desc: 监管者态。E27 证过特权级范围是一个开关而不是架构分岔
test:
  # S 级的委托（medeleg / mideleg 与 S 态陷入）还没实现，这些位现在只是
  # 软件读得到写得进的占位；smode 关掉时它们整体消失，开着时也只到这一步。
  # mscratch 按规范本来就是纯软件暂存，硬件永远不读它。
  unused:
  - mstatus_sie
  - mstatus_spie
  - mstatus_spie_in
  - mstatus_spp
  - mstatus_spp_in
  - mie_ssie
  - mie_stie
  - mie_seie
  - mip_ssip_in
  - mip_stip_in
  - mip_seip_in
  - mscratch
emit:
- kind: bsv
  package: Hart
  module: mkHart
  config_type: HartCfg
  interface: HartIfc
  pins:
  - name: imem
    type: RegManager
    targs:
    - 32
    - 32
  - name: dmem
    type: RegManager
    targs:
    - 32
    - 32
  - name: pins
    type: HartPins
deps:
  hwcore: ^0.1
